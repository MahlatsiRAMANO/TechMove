name: Build and test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # 1) Build the solution, then run unit tests + in-process API integration tests
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TechMove.sln

      - name: Build
        run: dotnet build TechMove.sln --no-restore --configuration Release

      - name: Test (unit + integration)
        run: dotnet test TechMove.sln --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  # 2) Build the Docker images, start the whole system with docker compose,
  #    and run the integration tests against the RUNNING API container.
  docker-compose-integration:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and start containers
        run: docker compose up --build --detach

      - name: Wait for the API to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl --silent --fail http://localhost:5001/health; then echo " API is up"; exit 0; fi
            echo "Waiting for API... ($i)"; sleep 5
          done
          echo "API did not become healthy"; exit 1

      - name: Check the frontend responds
        run: curl --silent --fail --output /dev/null --write-out "%{http_code}\n" http://localhost:5000/Account/Login

      - name: Integration tests against the running API container
        env:
          TECHMOVE_API_URL: http://localhost:5001
        run: dotnet test tests/TechMove.Tests/TechMove.Tests.csproj --configuration Release --filter "Category=Integration" --verbosity normal --logger "trx;LogFileName=docker-integration.trx"

      - name: Container logs
        if: always()
        run: docker compose logs --no-color

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-integration-results
          path: "**/TestResults/*.trx"

      - name: Stop containers
        if: always()
        run: docker compose down --volumes
